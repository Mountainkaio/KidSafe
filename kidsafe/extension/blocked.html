<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Site bloqueado - KidSafe</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				position: fixed;
				inset: 0;
				background: #111827;
				color: #ffffff;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 24px;
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			}
			.icon-wrapper {
				margin-bottom: 20px;
				color: #ef4444;
			}
			h1 {
				font-size: 1.8rem;
				font-weight: 700;
				margin-bottom: 12px;
				color: #ffffff;
			}
			p {
				color: #9ca3af;
				max-width: 420px;
				font-size: 1.1rem;
				line-height: 1.5;
				margin-bottom: 24px;
			}
			.btn-back {
				padding: 10px 32px;
				background: #2563eb;
				color: #ffffff;
				border: none;
				border-radius: 8px;
				font-size: 1rem;
				font-weight: 600;
				cursor: pointer;
				transition: background 0.15s ease;
			}
			.btn-back:hover {
				background: #1d4ed8;
			}
			.footer-tag {
				position: absolute;
				bottom: 24px;
				font-size: 0.85rem;
				color: #6b7280;
				letter-spacing: 0.05em;
			}
		</style>
	</head>
	<body>
		<div class="icon-wrapper">
			<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
				<line x1="12" y1="8" x2="12" y2="12"/>
				<line x1="12" y1="16" x2="12.01" y2="16"/>
			</svg>
		</div>
		<h1>Site bloqueado</h1>
		<p>Este site foi bloqueado pelo responsável.</p>
		<button class="btn-back" id="backBtn">Voltar</button>
		<div class="footer-tag">KidSafe • Navegação Segura</div>

		<script>
			document.getElementById("backBtn").addEventListener("click", () => {
				if (window.history.length > 1) {
					window.history.back();
				} else {
					window.close();
				}
			});
		</script>
	</body>
</html>
